<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container">
        <!-- القسم الأيسر: شعار فيسبوك والنص الترحيبي -->
        <div class="left-section">
            <img src="imgs/4lCu2zih0ca.svg" alt="Facebook" class="fb-logo">
            <p class="fb-description">Facebook helps you connect and share with the people in your life.</p>
        </div>

        <!-- القسم الأيمن: صندوق تسجيل الدخول -->
        <div class="right-section">
            <div class="login-card">
                <form>
                    <input type="text" placeholder="Email address or phone number" class="input-field">
                    <input type="password" placeholder="Password" class="input-field">
                    <button type="submit" class="login-btn">Log in</button>
                </form>
                <div class="forgot-password">
                    <a href="#">Forgotten Password</a>
                </div>
                <hr class="divider">
                <div class="create-account-container">
                    <button class="create-btn">Create new account</button>
                </div>
            </div>
        </div>
        
        <!-- مسح التأثيرات (Clearfix) الخاصة بالفلوت -->
        <div class="clearfix"></div>
    </div>

</body>
</html>
